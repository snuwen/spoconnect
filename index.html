<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Connect Spotify</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="card">
    <div class="logo">●</div>
    <h1>Connect Spotify</h1>
    <p id="status">Paste your Spotify app's Client ID below, then connect. You'll get a Client ID and Refresh Token to paste into your widget.</p>

    <div class="field" id="clientIdField">
      <input type="text" id="clientIdInput" placeholder="Spotify Client ID">
    </div>
    <button id="connectBtn" hidden>Connect to Spotify</button>

    <div class="result" id="result" hidden>
      <label>Spotify Client ID</label>
      <div class="row">
        <input type="text" id="resultClientId" readonly>
        <button class="copy-btn" data-copy="resultClientId">Copy</button>
      </div>
      <label>Spotify Refresh Token</label>
      <div class="row">
        <input type="text" id="resultRefreshToken" readonly>
        <button class="copy-btn" data-copy="resultRefreshToken">Copy</button>
      </div>
      <p class="hint">Paste both of these into your widget's own Spotify Client ID / Refresh Token fields.</p>
    </div>
  </div>
  <script src="script.js"></script>
</body>
</html>
